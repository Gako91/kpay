services:
  kpay:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9199:9199"
    environment:
      - KPAY_PORT=9199
      - KPAY_ENV=prod
      - KPAY_API_KEY=kpay_secret_key_change_in_production
      - KPAY_JWT_SECRET=change_this_jwt_secret_in_production
      - KPAY_JWT_EXPIRATION_HOURS=24
      - KPAY_CORS_ORIGINS=*
      - KPAY_LOG_LEVEL=info
      - KPAY_RATE_LIMIT_MAX=300
      - KPAY_RATE_LIMIT_WINDOW=60
      - KPAY_DB_HOST=db
      - KPAY_DB_PORT=5432
      - KPAY_DB_USER=kpay_user
      - KPAY_DB_PASSWORD=secure_password
      - KPAY_DB_NAME=kpay_db
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=payslips
      # Pool de connexions DB
      - KPAY_DB_POOL_MAX_OPEN=10
      - KPAY_DB_POOL_MAX_IDLE=2
      - KPAY_DB_POOL_CONN_MAX_LIFETIME=0
      # SMTP (mails réels si KPAY_SMTP_ENABLED=true)
      - KPAY_SMTP_ENABLED=false
      - KPAY_SMTP_HOST=smtp.gmail.com
      - KPAY_SMTP_PORT=587
      - KPAY_SMTP_USERNAME=
      - KPAY_SMTP_PASSWORD=
      - KPAY_SMTP_FROM=kpay@localhost
      - KPAY_SMTP_SSL=false
      - KPAY_SMTP_STARTTLS=true
    volumes:
      - kpay_storage:/app/storage/payslips
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kpay_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: kpay_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5479:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpay_user -d kpay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/payslips --ignore-existing;
      exit 0;
      "

volumes:
  kpay_storage:
  pg_data:
  minio_data:
