name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kpay
          POSTGRES_PASSWORD: kpay
          POSTGRES_DB: kpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kpay -d kpay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends gcc make libc6-dev libpq-dev libatomic1

      # Même méthode que le Dockerfile : dernière version de V depuis les sources
      - name: Install V
        run: |
          git clone --depth 1 https://github.com/vlang/v "$HOME/vlang"
          cd "$HOME/vlang" && make
          sudo ./v symlink
          v version

      - name: Install pdf module
        working-directory: backend
        run: v install pdf

      - name: Check compilation
        working-directory: backend
        run: v -check main.v

      - name: Unit tests
        working-directory: backend
        run: v -cc gcc test core/ common/ services/

      # Tests contre un vrai PostgreSQL : ids d'insertion, transactions,
      # isolation multi-tenant, migrations rejouables.
      - name: Integration tests (PostgreSQL)
        working-directory: backend
        env:
          KPAY_TEST_REQUIRE_DB: '1'
          KPAY_TEST_DB_HOST: 127.0.0.1
          KPAY_TEST_DB_PORT: '5432'
          KPAY_TEST_DB_USER: kpay
          KPAY_TEST_DB_PASSWORD: kpay
          KPAY_TEST_DB_NAME: kpay_test
        run: v -cc gcc -stats test repository/

      - name: Build production
        working-directory: backend
        run: v -cc gcc -prod -o /tmp/kpay-prod main.v

  # Construit l'image Docker à chaque run ; la pousse sur GHCR uniquement sur main.
  docker:
    runs-on: ubuntu-latest
    needs: backend
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kpay-backend
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build -- --configuration production
