server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Résolution dynamique via le DNS Docker (le backend peut redémarrer)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Proxy API vers le backend Vlang
    location /api/v1/ {
        set $kpay_upstream http://kpay:9199;
        # Retire le préfixe /api/v1 (nginx ne réécrit plus l'URI avec proxy_pass variable)
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass $kpay_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Si le backend est injoignable, retour 503 au lieu d'une erreur nginx
        proxy_connect_timeout 2s;
        proxy_next_upstream off;
        error_page 502 503 504 =503 @api_down;
    }

    location @api_down {
        return 503 '{"success":false,"message":"API indisponible"}';
    }

    # Cache immutable pour les assets Angular (fichiers hashés)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — toutes les routes non trouvées retournent index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
